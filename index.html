<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Modul Ajar Kurikulum Merdeka - Deep Learning Project</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    @media print {
      .no-print {
        display: none !important;
      }
      .print-only {
        display: block !important;
      }
      body {
        background-color: white !important;
        color: black !important;
      }
      .print-shadow-none {
        box-shadow: none !important;
        border: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Icon helper component (Safe DOM isolation for Lucide)
    const Icon = ({ name, size = 18, className = "" }) => {
      const spanRef = useRef(null);
      useEffect(() => {
        if (spanRef.current && window.lucide) {
          spanRef.current.innerHTML = `<i data-lucide="${name}" style="width: ${size}px; height: ${size}px;" class="inline-block"></i>`;
          window.lucide.createIcons();
        }
      }, [name, size]);
      return <span ref={spanRef} className={`inline-flex items-center justify-center ${className}`}></span>;
    };

    const INITIAL_FORM_DATA = {
      satuanPendidikan: "SMK Negeri 1 Amarasi Selatan",
      konsentrasiKeahlian: "Agribisnis Tanaman Pangan dan Hortikultura",
      mapelUtama: "Konsentrasi Keahlian Agribisnis Tanaman Pangan dan Hortikultura",
      temaProyek: "Pengembangan Budidaya Hortikultura Organik Berkelanjutan Berbasis Digital & Pemasaran Modern",
      kelasFase: "Kelas XI / Fase F",
      semester: "Ganjil",
      alokasiWaktu: "4 Minggu / 36 JP",
      cpUtama: "Pada akhir fase F, peserta didik mampu menerapkan teknik budidaya tanaman pangan dan hortikultura secara berkelanjutan, mengelola kesuburan tanah, mengendalikan OPT, memanen, serta mengelola pascamanen dan pemasaran hasil pertanian modern.",
      mapelKolaborasi: [
        { mapel: "Agribisnis Tanaman Hortikultura", kontribusi: "Perencanaan teknis budidaya, penyiapan media, penanaman, dan perawatan tanaman hortikultura.", tp: "Peserta didik mampu merancang dan menerapkan teknik budidaya tanaman hortikultura organik secara efektif (C6)." },
        { mapel: "Matematika", kontribusi: "Perhitungan analisis kebutuhan nutrisi, perkiraan hasil panen, dan analisis kelayakan usaha (R/C Ratio).", tp: "Peserta didik mampu menghitung efisiensi pembiayaan dan formulasi nutrisi tanaman secara presisi (C4)." },
        { mapel: "Informatika / Digital Marketing", kontribusi: "Pembuatan media promosi digital, branding produk, dan pengelolaan toko online.", tp: "Peserta didik mampu merancang strategi pemasaran digital berbasis media sosial dan e-commerce (C6)." },
        { mapel: "Bahasa Indonesia", kontribusi: "Penyusunan laporan ilmiah hasil proyek dan pembuatan teks deskripsi/promosi produk.", tp: "Peserta didik mampu menyusun laporan hasil proyek berbasis bukti empiris dengan struktur bahasa yang baku (C5)." },
        { mapel: "Pancasila & Kewarganegaraan", kontribusi: "Penerapan etika bisnis ramah lingkungan dan kerja sama tim dalam kearifan lokal.", tp: "Peserta didik mampu menginternalisasi nilai gotong royong dan tanggung jawab lingkungan dalam usaha pertanian (A5)." }
      ],
      dimensiProfil: [
        "Keimanan & Ketakwaan terhadap TYME",
        "Penalaran Kritis",
        "Kreativitas",
        "Kolaborasi",
        "Kemandirian"
      ],
      timPenyusun: [
        { nama: "Imanuel", nip: "1977" },
        { nama: "Imanuel M", nip: "1988" },
        { nama: "Imanuel Maniyeni", nip: "1978" }
      ],
      kepalaSekolah: "Rizal B. Ndolu, S.Pi.,MM",
      nipKepalaSekolah: "197205252006041017",
      tanggalPenyusunan: "10 Juli 2025"
    };

    function App() {
      const [formData, setFormData] = useState(INITIAL_FORM_DATA);
      const [generatedModule, setGeneratedModule] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);
      const [activeTab, setActiveTab] = useState("form");
      const [copied, setCopied] = useState(false);

      const handleInputChange = (field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
      };

      const handleMapelChange = (index, field, value) => {
        const updated = [...formData.mapelKolaborasi];
        updated[index][field] = value;
        setFormData(prev => ({ ...prev, mapelKolaborasi: updated }));
      };

      const addMapel = () => {
        setFormData(prev => ({
          ...prev,
          mapelKolaborasi: [...prev.mapelKolaborasi, { mapel: "", kontribusi: "", tp: "" }]
        }));
      };

      const removeMapel = (index) => {
        setFormData(prev => ({
          ...prev,
          mapelKolaborasi: prev.mapelKolaborasi.filter((_, i) => i !== index)
        }));
      };

      const handleTimChange = (index, field, value) => {
        const updated = [...formData.timPenyusun];
        updated[index][field] = value;
        setFormData(prev => ({ ...prev, timPenyusun: updated }));
      };

      const addTim = () => {
        setFormData(prev => ({
          ...prev,
          timPenyusun: [...prev.timPenyusun, { nama: "", nip: "" }]
        }));
      };

      const removeTim = (index) => {
        setFormData(prev => ({
          ...prev,
          timPenyusun: prev.timPenyusun.filter((_, i) => i !== index)
        }));
      };

      const toggleDimensi = (dim) => {
        setFormData(prev => {
          const current = prev.dimensiProfil;
          if (current.includes(dim)) {
            return { ...prev, dimensiProfil: current.filter(d => d !== dim) };
          } else {
            return { ...prev, dimensiProfil: [...current, dim] };
          }
        });
      };

      // AI Recommendation for Tema Proyek based on CP, Mapel Utama, Konsentrasi, and Kelas/Fase
      const handleAiRecommendTema = () => {
        const generated = `Inovasi Proyek Kolaboratif ${formData.konsentrasiKeahlian} Berbasis Pangan Sehat, Smart Farming & Digital Marketing (${formData.kelasFase})`;
        setFormData(prev => ({ ...prev, temaProyek: generated }));
      };

      // AI Recommendation for Matriks Mapel based on CP, Tema, and Kelas/Fase
      const handleAiRecommendMapel = () => {
        const recommended = [
          { mapel: formData.mapelUtama, kontribusi: "Perencanaan teknis budidaya, penyiapan media, penanaman, dan perawatan tanaman hortikultura.", tp: "Peserta didik mampu merancang dan menerapkan teknik budidaya tanaman hortikultura organik secara efektif (C6)." },
          { mapel: "Matematika", kontribusi: "Perhitungan analisis kebutuhan nutrisi, perkiraan hasil panen, dan analisis kelayakan usaha (R/C Ratio).", tp: "Peserta didik mampu menghitung efisiensi pembiayaan dan formulasi nutrisi tanaman secara presisi (C4)." },
          { mapel: "Informatika / Digital Marketing", kontribusi: "Pembuatan media promosi digital, branding produk, dan pengelolaan toko online.", tp: "Peserta didik mampu merancang strategi pemasaran digital berbasis media sosial dan e-commerce (C6)." },
          { mapel: "Bahasa Indonesia", kontribusi: "Penyusunan laporan ilmiah hasil proyek dan pembuatan teks deskripsi/promosi produk.", tp: "Peserta didik mampu menyusun laporan hasil proyek berbasis bukti empiris dengan struktur bahasa yang baku (C5)." },
          { mapel: "Pancasila & Kewarganegaraan", kontribusi: "Penerapan etika bisnis ramah lingkungan dan kerja sama tim dalam kearifan lokal.", tp: "Peserta didik mampu menginternalisasi nilai gotong royong dan tanggung jawab lingkungan dalam usaha pertanian (A5)." }
        ];
        setFormData(prev => ({ ...prev, mapelKolaborasi: recommended }));
      };

      const handleGenerate = () => {
        setIsGenerating(true);
        setTimeout(() => {
          setGeneratedModule(true);
          setIsGenerating(false);
          setActiveTab("preview");
        }, 1000);
      };

      const copyToClipboard = () => {
        const content = document.getElementById("printable-module")?.innerText;
        if (content) {
          navigator.clipboard.writeText(content);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      const downloadWord = () => {
        const content = document.getElementById("printable-module")?.innerHTML;
        const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Modul Ajar</title></head><body>${content}</body></html>`;
        const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Modul_Ajar_Deep_Learning_SMKN1AmarasiSelatan.doc';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          if (a.parentNode) {
            a.parentNode.removeChild(a);
          }
          URL.revokeObjectURL(url);
        }, 100);
      };

      const handlePrint = () => {
        window.print();
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 no-print">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-blue-600 rounded-lg">
                  <Icon name="book-open" size={22} className="text-white" />
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight">Generator Modul Ajar Proyek Kolaborasi</h1>
                  <p className="text-xs text-slate-400">SMK Negeri 1 Amarasi Selatan</p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setActiveTab("form")}
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${
                    activeTab === "form" 
                      ? "bg-blue-600 text-white" 
                      : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                  }`}
                >
                  <Icon name="edit-3" size={16} className="mr-1.5 inline" /> Input Data
                </button>
                <button
                  onClick={() => {
                    if (!generatedModule) handleGenerate();
                    setActiveTab("preview");
                  }}
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${
                    activeTab === "preview" 
                      ? "bg-blue-600 text-white" 
                      : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                  }`}
                >
                  <Icon name="file-text" size={16} className="mr-1.5 inline" /> Modul Dokumen
                </button>
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:px-8 py-6">
            {activeTab === "form" ? (
              <div className="space-y-6">
                {/* Intro Banner */}
                <div className="bg-gradient-to-r from-slate-900 to-blue-900 text-white p-6 rounded-2xl shadow-lg border border-slate-700">
                  <div className="max-w-3xl">
                    <span className="px-3 py-1 bg-blue-500/20 text-blue-300 rounded-full text-xs font-semibold uppercase tracking-wider border border-blue-400/30">
                      Vokasi & Kolaboratif
                    </span>
                    <h2 className="text-2xl font-bold mt-2">Penyusun Modul Ajar Pembelajaran Mendalam</h2>
                    <p className="text-slate-300 text-sm mt-2 leading-relaxed">
                      Merancang alur pembelajaran terintegrasi <b>Mindful, Meaningful, & Joyful</b> melalui tahapan <b>Memahami, Mengaplikasi, dan Merefleksi</b> secara otomatis, saintifik, dan operasional.
                    </p>
                  </div>
                </div>

                {/* Form Sections */}
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
                  <h3 className="text-lg font-bold text-slate-900 border-b pb-3 flex items-center gap-2">
                    <Icon name="school" className="text-blue-600" /> 1. Identitas Satuan & Proyek
                  </h3>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Satuan Pendidikan</label>
                      <input 
                        type="text" 
                        value={formData.satuanPendidikan}
                        onChange={(e) => handleInputChange("satuanPendidikan", e.target.value)}
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Konsentrasi Keahlian</label>
                      <input 
                        type="text" 
                        value={formData.konsentrasiKeahlian}
                        onChange={(e) => handleInputChange("konsentrasiKeahlian", e.target.value)}
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Mata Pelajaran Utama</label>
                      <input 
                        type="text" 
                        value={formData.mapelUtama}
                        onChange={(e) => handleInputChange("mapelUtama", e.target.value)}
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Kelas / Fase / Semester</label>
                      <div className="grid grid-cols-2 gap-2">
                        <input 
                          type="text" 
                          value={formData.kelasFase}
                          onChange={(e) => handleInputChange("kelasFase", e.target.value)}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        />
                        <input 
                          type="text" 
                          value={formData.semester}
                          onChange={(e) => handleInputChange("semester", e.target.value)}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        />
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Alokasi Waktu</label>
                      <input 
                        type="text" 
                        value={formData.alokasiWaktu}
                        onChange={(e) => handleInputChange("alokasiWaktu", e.target.value)}
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="block text-xs font-bold text-slate-700 uppercase">Tema Proyek Kolaborasi</label>
                        <button 
                          onClick={handleAiRecommendTema}
                          className="text-xs text-blue-600 font-bold hover:underline flex items-center gap-1"
                        >
                          <Icon name="sparkles" size={12} /> Minta AI Rekomendasikan
                        </button>
                      </div>
                      <input 
                        type="text" 
                        value={formData.temaProyek}
                        onChange={(e) => handleInputChange("temaProyek", e.target.value)}
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Capaian Pembelajaran (CP Utama)</label>
                    <textarea 
                      rows={3}
                      value={formData.cpUtama}
                      onChange={(e) => handleInputChange("cpUtama", e.target.value)}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>
                </div>

                {/* Mapel Kolaborasi */}
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
                  <div className="flex flex-wrap justify-between items-center border-b pb-3 gap-2">
                    <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                      <Icon name="layers" className="text-blue-600" /> 2. Matriks Lintas Disiplin Ilmu (Minimal 3-5 Mapel)
                    </h3>
                    <div className="flex items-center gap-2">
                      <button 
                        onClick={handleAiRecommendMapel}
                        className="px-3 py-1.5 bg-indigo-50 text-indigo-600 rounded-lg font-semibold text-xs hover:bg-indigo-100 flex items-center gap-1"
                      >
                        <Icon name="sparkles" size={14} /> Minta AI Rekomendasikan
                      </button>
                      <button 
                        onClick={addMapel}
                        className="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg font-semibold text-xs hover:bg-blue-100 flex items-center gap-1"
                      >
                        <Icon name="plus" size={14} /> Tambah Mapel
                      </button>
                    </div>
                  </div>

                  <div className="space-y-4">
                    {formData.mapelKolaborasi.map((item, idx) => (
                      <div key={idx} className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-3 relative">
                        <button 
                          onClick={() => removeMapel(idx)}
                          className="absolute top-3 right-3 text-slate-400 hover:text-red-600 text-xs"
                          title="Hapus"
                        >
                          <Icon name="trash-2" size={16} />
                        </button>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                          <div>
                            <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Mata Pelajaran Kolaborasi #{idx + 1}</label>
                            <input 
                              type="text" 
                              value={item.mapel}
                              onChange={(e) => handleMapelChange(idx, "mapel", e.target.value)}
                              placeholder="Nama Mapel"
                              className="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Kontribusi dalam Proyek</label>
                            <input 
                              type="text" 
                              value={item.kontribusi}
                              onChange={(e) => handleMapelChange(idx, "kontribusi", e.target.value)}
                              placeholder="Kontribusi fisik/konseptual"
                              className="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Tujuan Pembelajaran (ABCD + Bloom)</label>
                            <input 
                              type="text" 
                              value={item.tp}
                              onChange={(e) => handleMapelChange(idx, "tp", e.target.value)}
                              placeholder="TP Spesifik Mapel"
                              className="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
                            />
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Dimensi & Pengesahan */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* Dimensi Profil Lulusan */}
                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                    <h3 className="text-lg font-bold text-slate-900 border-b pb-3 flex items-center gap-2">
                      <Icon name="award" className="text-blue-600" /> 3. Dimensi Profil Lulusan
                    </h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {[
                        "Keimanan & Ketakwaan terhadap TYME",
                        "Kewargaan",
                        "Penalaran Kritis",
                        "Kreativitas",
                        "Kolaborasi",
                        "Kemandirian",
                        "Kesehatan",
                        "Komunikasi"
                      ].map((dim, i) => (
                        <label key={i} className="flex items-center space-x-2 text-sm text-slate-700 cursor-pointer p-2 rounded-lg hover:bg-slate-50 border border-transparent hover:border-slate-200">
                          <input 
                            type="checkbox" 
                            checked={formData.dimensiProfil.includes(dim)}
                            onChange={() => toggleDimensi(dim)}
                            className="rounded text-blue-600 focus:ring-blue-500 h-4 w-4"
                          />
                          <span>{dim}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* Pengesahan & Penyusun */}
                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                    <h3 className="text-lg font-bold text-slate-900 border-b pb-3 flex items-center gap-2">
                      <Icon name="users" className="text-blue-600" /> 4. Legitimasi & Penyusun
                    </h3>
                    <div className="space-y-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Kepala Sekolah & NIP</label>
                        <div className="grid grid-cols-2 gap-2">
                          <input 
                            type="text" 
                            value={formData.kepalaSekolah}
                            onChange={(e) => handleInputChange("kepalaSekolah", e.target.value)}
                            placeholder="Nama Kepala Sekolah"
                            className="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm"
                          />
                          <input 
                            type="text" 
                            value={formData.nipKepalaSekolah}
                            onChange={(e) => handleInputChange("nipKepalaSekolah", e.target.value)}
                            placeholder="NIP Kepala Sekolah"
                            className="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm"
                          />
                        </div>
                      </div>

                      <div>
                        <div className="flex justify-between items-center mb-1">
                          <label className="block text-xs font-bold text-slate-600 uppercase">Tim Guru Penyusun</label>
                          <button onClick={addTim} className="text-xs text-blue-600 font-semibold">+ Tambah Guru</button>
                        </div>
                        {formData.timPenyusun.map((guru, idx) => (
                          <div key={idx} className="flex gap-2 mb-2">
                            <input 
                              type="text" 
                              value={guru.nama}
                              onChange={(e) => handleTimChange(idx, "nama", e.target.value)}
                              placeholder="Nama Guru"
                              className="w-1/2 px-3 py-1.5 border border-slate-300 rounded-lg text-sm"
                            />
                            <input 
                              type="text" 
                              value={guru.nip}
                              onChange={(e) => handleTimChange(idx, "nip", e.target.value)}
                              placeholder="NIP"
                              className="w-1/2 px-3 py-1.5 border border-slate-300 rounded-lg text-sm"
                            />
                            {formData.timPenyusun.length > 1 && (

                      <div className="space-y-2 text-xs">
                        <p className="font-bold text-slate-800">Minggu 1: Pertanyaan Mendasar & Perencanaan Teknis Budidaya</p>
                        <p className="font-semibold text-slate-700">• Kegiatan Awal (Mindful, Meaningful, Joyful):</p>
                        <ol className="list-decimal list-inside pl-3 space-y-1">
                          <li><b>Mindful:</b> Guru mengajak murid melakukan pengamatan hening (mindful observation) pada kondisi tanah lahan sekolah dan mendengarkan suara alam untuk membangun keterikatan dengan bumi.</li>
                          <li><b>Meaningful:</b> Guru menunjukkan dua sampel produk sayur: sayur konvensional yang terpapar pestisida kimia dan sayur organik segar hasil budidaya ramah lingkungan. Guru memantik ide: &quot;Bagaimana kita bisa memberi makan masyarakat Amarasi Selatan dengan pangan yang sehat tanpa merusak tanah kita?&quot;</li>
                          <li><b>Joyful:</b> Permainan kuis interaktif &quot;Tebak Hama & Sahabat Petani&quot; untuk menguji pengetahuan awal secara menyenangkan.</li>
                          <li>Guru menyampaikan tujuan pembelajaran proyek kolaborasi dan alokasi waktu 4 minggu.</li>
                          <li>Pembentukan kelompok kerja heterogen (masing-masing 4–5 murid).</li>
                        </ol>
                        <p className="font-semibold text-slate-700">• Kegiatan Inti:</p>
                        <ul className="list-disc list-inside pl-3 space-y-1">
                          <li><b>MEMAHAMI (Mindful & Meaningful):</b> Murid mengeksplorasi literatur mengenai kriteria pupuk cair organik (POC) dan pestisida hayati berbasis bahan lokal (daun mimba, serai, bawang putih). Murid menganalisis kebutuhan nutrisi tanaman hortikultura yang dipilih (misalnya: Caisim/Terung).</li>
                          <li><b>MENGAPLIKASI (Syntax PjBL 1 & 2 - Meaningful & Joyful):</b> Sintaks 1 (Pertanyaan Mendasar): Murid merumuskan pertanyaan kunci: &quot;Berapa dosis bio-pestisida paling efektif untuk menekan hama tanpa menurunkan produktivitas?&quot;. Sintaks 2 (Mendesain Perencanaan Proyek): Murid merancang jadwal olah tanah, pembuatan media tanam, persemaian benih, dan jadwal aplikasi bio-pestisida.</li>
                        </ul>
                        <p className="font-semibold text-slate-700">• Kegiatan Penutupan (Mindful):</p>
                        <ol className="list-decimal list-inside pl-3 space-y-1">
                          <li>Murid melakukan refleksi singkat: &quot;Satu hal baru yang saya rasakan saat menyentuh tanah hari ini.&quot;</li>
                          <li>Guru memberikan koreksi konstruktif atas desain proyek yang dibuat.</li>
                          <li>Apresiasi atas kerja tim murid.</li>
                          <li>Doa penutup bersama.</li>

                          <li><b>Meaningful:</b> Guru mengaitkan kebersihan lahan dengan kesehatan produk yang dihasilkan.</li>
                          <li><b>Joyful:</b> Yel-yel motivasi kelompok tani muda.</li>
                          <li>Mereviu catatan logbook minggu ke-1.</li>
                          <li>Penyampaian target pekerjaan hari ini: aplikasi nutrisi dan penyiapan sistem proteksi tanaman.</li>

                        <p className="font-semibold text-slate-700">• Kegiatan Inti:</p>
